worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;

  # Only the reverse proxy (same Docker network) may tell us the real client address; anyone else is read as is.
  # The header is then REWRITTEN below (never appended), so a forged X-Real-IP / X-Forwarded-For is overwritten (AD-9).
  # Only the `dnd-edge` network (docker-compose.yml: 172.29.77.0/24), where the reverse proxy sits.
  set_real_ip_from 172.29.77.0/24;
  real_ip_header X-Real-IP;

  # Docker's embedded DNS: upstreams are resolved per request, so a stopped or restarted service
  # (account-admin is optional) never prevents the gateway from starting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection '';
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  server {
    listen 8080;
    server_name _;

    include /etc/nginx/conf.d/security-headers.conf;

    # Health check for the gateway itself.
    location = /healthz {
      default_type text/plain;
      return 200 'ok';
    }

    location /auth/v1/ {
      set $upstream http://auth:9999;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    # PostgREST serves its OpenAPI description (every table and column) at the root, even to the public key.
    # The app never reads it: do not hand a map of the schema to anyone.
    location = /rest/v1/ {
      return 404;
    }

    location /rest/v1/ {
      set $upstream http://rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    location /storage/v1/ {
      set $upstream http://storage:5000;
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass $upstream;
    }

    # account-admin serves its own /admin-api prefix: the path is passed on unchanged.
    location /admin-api/ {
      set $upstream http://account-admin:8787;
      proxy_pass $upstream;
    }

    # Built front (Vite). Hashed assets are immutable; the page itself is never cached.
    location /assets/ {
      root /usr/share/nginx/html;
      include /etc/nginx/conf.d/security-headers.conf;
      add_header Cache-Control 'public, max-age=31536000, immutable' always;
      try_files $uri =404;
    }

    location / {
      root /usr/share/nginx/html;
      include /etc/nginx/conf.d/security-headers.conf;
      add_header Cache-Control 'no-cache' always;
      try_files $uri /index.html;
    }
  }
}
