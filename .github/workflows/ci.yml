name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Tests mock Supabase; src/lib/supabase.ts only needs the variables to be defined
env:
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Format
        if: success() || failure()
        run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  bdd:
    name: BDD (Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:bdd

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  sql:
    name: SQL tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Database only: the access rules are tested in SQL (AD-14). Later stories that
      # need Auth or Storage remove services from this exclusion list.
      - name: Start local Supabase (database only)
        run: npx supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run pgTAP tests
        run: npx supabase test db --local

  e2e:
    name: Mobile and contrast checks (360 px, 3 themes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  cutover:
    name: Cutover test (all-or-nothing, no data lost)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database only)
        run: npx supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Rebuild the pre-lock database, fail a cutover, run the real one, check the data
        run: bash scripts/cutover/test-cutover.sh

  stack:
    name: QNAP stack (compose, migrations, gateway, load)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start the lightweight stack in an isolated compose project, apply the migrations
        run: bash deploy/qnap/localtest.sh up
      - name: What a visitor can and cannot do through the gateway
        run: |
          ANON_KEY="$(grep '^ANON_KEY=' .localtest-stack/.env | cut -d= -f2)"
          ADMIN_API=1 BASE_URL=http://127.0.0.1:8081 ANON_KEY="$ANON_KEY" node deploy/qnap/smoke.mjs
      - name: Five players for 40 seconds (sign in, read, write, upload a portrait)
        run: |
          ANON_KEY="$(grep '^ANON_KEY=' .localtest-stack/.env | cut -d= -f2)"
          SERVICE_ROLE_KEY="$(grep '^SERVICE_ROLE_KEY=' .localtest-stack/.env | cut -d= -f2)"
          BASE_URL=http://127.0.0.1:8081 ANON_KEY="$ANON_KEY" SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            DURATION_S=40 THINK_MIN_MS=300 THINK_MAX_MS=800 ADMIN_API=1 node deploy/qnap/loadtest.mjs > /dev/null
      - name: Logs on failure
        if: failure()
        run: bash deploy/qnap/localtest.sh logs
      - name: Clean up
        if: always()
        run: bash deploy/qnap/localtest.sh down
